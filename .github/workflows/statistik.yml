name: Instagram-Statistik

# Nur von Hand: liest Kennzahlen (nichts wird veröffentlicht). Die Ausgabe wird mit dem öffentlichen Schlüssel
# werkzeuge/statistik_public.pem verschlüsselt, weil Protokolle dieses öffentlichen Repositorys einsehbar sind.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  statistik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: Kennzahlen lesen und verschlüsseln
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python statistik.py > s.json 2> fehler.txt || { echo "Fehler beim Lesen"; tail -c 300 fehler.txt | sed 's/EAA[A-Za-z0-9]*/***/g'; exit 1; }
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in s.json -out s.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey werkzeuge/statistik_public.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          rm -f s.json k.bin
          mkdir -p data/statistik && mv k.enc data/statistik/schluessel.enc && mv s.enc data/statistik/daten.enc
          git config user.name "inpernell-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/statistik && git commit -q -m "Statistik: verschlüsselter Stand" && git push -q
