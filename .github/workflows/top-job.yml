name: Top Job des Tages

on:
  schedule:
    # GitHub rechnet in Weltzeit (UTC). Zwei Zeiten, damit es im Winter (11:50 UTC) und im
    # Sommer (10:50 UTC) jeweils 12:50 Uhr in Deutschland ist. Das Programm prüft die Uhrzeit selbst.
    - cron: "50 10 * * 1-5"
    - cron: "50 11 * * 1-5"
  workflow_dispatch:
    inputs:
      probelauf:
        description: "Probelauf: nur Bild/Reel und Text erzeugen, NICHT veröffentlichen"
        type: boolean
        default: true
      format:
        description: "Format (leer = laut Wochenplan)"
        type: choice
        options: ["", "bild", "reel"]
        default: ""

permissions:
  contents: write

concurrency:
  group: top-job
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: ffmpeg für das Reel
        # nur nötig, wenn ein Reel entsteht (Handstart mit Format "reel"). Wer im WOCHENPLAN Reel-Tage
        # einträgt, entfernt diese if-Zeile.
        if: ${{ inputs.format == 'reel' }}
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Top Job erstellen und veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.probelauf || 'false' }}
          ERZWINGEN: ${{ github.event_name == 'workflow_dispatch' }}
          FORMAT: ${{ inputs.format }}
        run: python agent.py
