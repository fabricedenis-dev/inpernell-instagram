name: Reel der Woche

on:
  schedule:
    # Pünktlich: Di/Do 07:30, So 17:00 Uhr und Sonder-Reels (z. B. Sketche 11:00/12:00) genau zur Uhrzeit.
    # GitHub startet geplante Läufe oft 30–60 Minuten zu spät, deshalb mehrere Starts bis 50 Minuten vorher:
    # der erste bereitet alles vor und veröffentlicht exakt zur Planzeit. Zwei UTC-Stunden je Zeit (Sommer/Winter).
    - cron: "40,50 4,5 * * 2,4"
    - cron: "0,10,20 5,6 * * 2,4"
    - cron: "10,20,30,40,50 14,15 * * 0"
    - cron: "10,20,30,40,50 7,8,9,10 * * *"
    # Nachhol-Läufe (veröffentlichen nur, wenn das Reel noch nicht erschienen ist)
    - cron: "0 7,8 * * 2,4"
    - cron: "0 16,17,18 * * 0"
    - cron: "0 11,12,13 * * *"
  workflow_dispatch:
    inputs:
      probelauf:
        description: "Probelauf: nur Video erzeugen, NICHT veröffentlichen"
        type: boolean
        default: true
      reel_id:
        description: "Bestimmtes Reel aus reels/warteschlange.json (leer = nächstes fälliges)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: inpernell-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Reel erstellen und veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.probelauf || 'false' }}
          ERZWINGEN: ${{ github.event_name == 'workflow_dispatch' }}
          REEL_ID: ${{ inputs.reel_id }}
        run: python reel_post.py
