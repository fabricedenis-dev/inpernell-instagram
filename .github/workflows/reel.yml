name: Reel der Woche

on:
  schedule:
    # Dienstag und Donnerstag 07:30, Sonntag 17:00 Uhr (Deutschland). GitHub rechnet in UTC,
    # deshalb je zwei Zeiten für Winter- und Sommerzeit; reel_post.py prüft die Uhrzeit selbst.
    - cron: "30 5,6 * * 2,4"
    - cron: "0 15,16 * * 0"
  workflow_dispatch:
    inputs:
      probelauf:
        description: "Probelauf: nur Video erzeugen, NICHT veröffentlichen"
        type: boolean
        default: true
      reel_id:
        description: "Bestimmtes Reel aus reels/warteschlange.json (leer = nächstes fälliges)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: inpernell-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Reel erstellen und veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.probelauf || 'false' }}
          ERZWINGEN: ${{ github.event_name == 'workflow_dispatch' }}
          REEL_ID: ${{ inputs.reel_id }}
        run: python reel_post.py
